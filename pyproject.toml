[project]
name = "miamstock"
version = "0.1.0"
description = "Stock alimentaire domestique avec scan de code-barres (PWA + API FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
miamstock = "miamstock.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Sans cette déclaration, setuptools n'embarque que les fichiers .py : la table
# Ciqual manquerait dans l'image Docker, et la recherche d'aliments génériques
# serait vide en production sans la moindre erreur visible.
[tool.setuptools.package-data]
miamstock = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
